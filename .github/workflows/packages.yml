name: packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/node/package-lock.json
            tools/cli/package-lock.json
            integrations/cloudflare-worker/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: server/python/pyproject.toml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Install dependencies
        id: install
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix server/node
          npm ci --prefix tools/cli
          python -m pip install --upgrade pip
          python -m pip install -e "server/python[test]"
          echo "- install: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Install worker dependencies
        id: install-worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: integrations/cloudflare-worker
        run: npm ci

      # The react and vue wrappers import the agent's dist, so it is built first.
      - name: web/agent build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run build --workspace web/agent
          echo "- web/agent build: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: web/agent test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm test --workspace web/agent
          echo "- web/agent test: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: web/react test and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm test --workspace web/react
          npm run build --workspace web/react
          echo "- web/react test and build: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: web/vue test and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm test --workspace web/vue --if-present
          npm run build --workspace web/vue
          echo "- web/vue test and build: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: server/node test and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: server/node
        run: |
          npm test
          npm run build
          echo "- server/node test and build: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: tools/cli test and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: tools/cli
        run: |
          npm test
          npm run build
          echo "- tools/cli test and build: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: server/python pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python -m pytest server/python
          echo "- server/python pytest: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: server/go vet, test and gofmt
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: server/go
        run: |
          go vet ./...
          go test ./...
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" && echo "$unformatted"
            exit 1
          fi
          echo "- server/go vet, test, gofmt: ok" >> "$GITHUB_STEP_SUMMARY"

      - name: integrations/cloudflare-worker typecheck and test
        if: ${{ !cancelled() && steps.install-worker.outcome == 'success' }}
        working-directory: integrations/cloudflare-worker
        run: |
          npm run typecheck
          npm test
          echo "- integrations/cloudflare-worker typecheck and test: ok" >> "$GITHUB_STEP_SUMMARY"
