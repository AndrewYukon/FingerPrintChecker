name: fingerprintchecker
description: Flutter plugin for FingerPrintChecker, a thin wrapper over the native Android and iOS SDKs.
version: 0.1.1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fpchecker.flutter
        pluginClass: FingerPrintCheckerPlugin
      ios:
        pluginClass: FingerPrintCheckerPlugin
